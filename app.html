function charged(aid){return S.d.charges.filter(function(c){return c.apartment_id==aid}).reduce(function(s,c){return s+(c.settled?paidIn(aid,c.period):Number(c.amount))},0)}
function paidOf(aid){return S.d.pays.filter(function(p){return p.apartment_id==aid&&!p.cancelled}).reduce(function(s,p){return s+Number(p.amount)},0)}
function dueOf(aid){return Math.max(charged(aid)-paidOf(aid),0)}
function paidIn(aid,p){return S.d.pays.filter(function(x){return x.apartment_id==aid&&x.period==p&&!x.cancelled}).reduce(function(s,x){return s+Number(x.amount)},0)}
function leftIn(aid,p){var c=S.d.charges.filter(function(x){return x.apartment_id==aid&&x.period==p&&!x.settled}).reduce(function(s,x){return s+Number(x.amount)},0);return Math.max(c-paidIn(aid,p),0)}
function isSet(aid,p){return S.d.charges.some(function(x){return x.apartment_id==aid&&x.period==p&&x.settled})}

function send(text){try{if(navigator.share){navigator.share({text:text}).catch(function(){});return}}catch(e){}try{navigator.clipboard.writeText(text).then(function(){toast(t('copied'))},function(){toast(t('copied'))})}catch(e){toast(t('copied'))}}
function totals(){var inn=S.d.pays.filter(function(p){return !p.cancelled}).reduce(function(s,p){return s+Number(p.amount)},0),out=S.d.exps.reduce(function(s,e){return s+Number(e.amount)},0),due=S.d.apts.reduce(function(s,a){return s+dueOf(a.id)},0);return {inn:inn,out:out,due:due}}
function expName(e){return e.category=='oth'&&e.note?e.note:catName(e.category)}
function catName(k){var m={elec:'c_elec',water:'c_water',lift:'c_lift',clean:'c_clean',sec:'c_sec',rep:'c_rep',oth:'c_oth'};return m[k]?t(m[k]):k}
function licLine(b){var s=bstate(b);if(s=='trial')return t('trial')+' · '+t('daysLeft',{n:Math.max(0,Math.ceil((new Date(b.trial_ends)-Date.now())/86400000))});if(s=='active')return t('paidL')+' · '+t('until',{d:new Date(b.license_ends).toLocaleDateString('en-GB')});return t(s=='paused'?'paused':'locked')}
function expMonths(){var ys={};ys[nowP().slice(0,4)]=1;S.d.charges.forEach(function(c){ys[String(c.period).slice(0,4)]=1});var out=[];Object.keys(ys).sort().reverse().forEach(function(y){for(var m=12;m>=1;m--)out.push(y+'-'+(m<10?'0':'')+m)});var sm=S.selM;if(sm&&out.indexOf(sm)<0)out.push(sm);return out}
function months(){var set={};S.d.exps.forEach(function(e){set[e.period]=1});set[nowP()]=1;return Object.keys(set).sort().reverse()}
function vDash(){
  var b=bcur(),m=S.role=='manager';
  var h='<div class="row" style="margin-top:14px"><button class="btn small ghost" onclick="toHome()">'+t('bk')+' '+t('backT')+'</button><span class="tag '+(m?'paid':'pic')+'">'+t(m?'manager':'resident')+'</span></div><h1 style="margin-top:12px">'+esc(b.name)+'</h1><div class="sub">'+esc(b.area)+sep()+esc(cnE(b.gov,b.city))+sep()+esc(gnE(b.gov))+'</div>';
  if(m&&bstate(b)!='trial'&&bstate(b)!='active')return h+lockCard(b);
  return h+(m?mTab(b):rTab(b));
}
async function toHome(){try{await loadHome();go('home')}catch(x){fail(x)}}

/* ---------- fees & payments tab (manager) ---------- */
function lastPayOf(aid){var l=S.d.pays.filter(function(p){return p.apartment_id==aid&&!p.cancelled});return l.length?l[l.length-1]:null}
function tagName(id){var g=(S.d.tags||[]).filter(function(x){return x.id==id})[0];return g?g.name:''}
function perSt(aid,c){return c.settled?'sx':paidIn(aid,c.period)>=Number(c.amount)?'paid':paidIn(aid,c.period)>0?'part':'out'}

  var h='',pt=b.plan_type,lk=!!pt&&S.d.charges.length>0,cp=lk?pt:(S.ptype||pt||'monthly'),sel=lk?pt:(S.ptype||pt),pu=t(pt=='monthly'?'perMonth':'perYear');

  if(pt){

      col=S.d.pays.filter(function(x){return x.period==p&&!x.cancelled}).reduce(function(x,y){return x+Number(y.amount)},0),
      rem=S.d.apts.reduce(function(x,a){return x+leftIn(a.id,p)},0);
    return '<div class="item wrap"><div><b>'+ml(p)+'</b> · '+(am.length==1?t('planText',{a:money(am[0]),u:pu}):am.map(money).join(' / '))+'<div class="sub">'+t('aptsN',{n:per[p]})+'</div><div class="sub"><b>'+t('feeCol',{a:money(col)})+'</b> · <b>'+t('feeRem',{a:money(rem)})+'</b></div></div><button class="btn small ghost" onclick="removeFees(\''+p+'\')">'+(S.delk=='f'+p?t('delConf'):t('removeFees'))+'</button></div>'}).join('')+'</div>';
  return h;

function settleToggle(a,pe,on){return act(function(){return sb.rpc('settle_period',{p_apartment:a,p_period:pe,p_on:on,p_note:''})},function(){return t(on?'sxOk':'sxUndone')})}
function setTag(a,v){return act(function(){return sb.rpc('set_apt_tag',{p_apartment:a,p_tag:v||null})},function(){return t('tagSaved')})}
function addTag(){var n=$('tgn').value.trim();if(!n){toast(t('tagNew'));return}return act(function(){return sb.rpc('add_tag',{p_building:S.cur,p_name:n})},function(){return t('tagAdded')})}
function delTag(id){if(S.delk!='g'+id){S.delk='g'+id;render();return}S.delk='';if(S.tagF==id)S.tagF='';return act(function(){return sb.rpc('delete_tag',{p_tag:id})},function(){return t('tagGone')})}
function mTab(b){
  var tb=S.tab,h='',T=totals();
  if(tb=='overview'){
    h+='<div class="hero"><div class="sub">'+t('fundBal')+'</div><div class="big">'+money(T.inn-T.out)+'</div><div class="sub">'+licLine(b)+'</div></div><div class="two"><div class="card"><div class="sub">'+t('cashIn')+'</div><div class="big">'+money(T.inn)+'</div></div><div class="card"><div class="sub">'+t('spent')+'</div><div class="big">'+money(T.out)+'</div></div></div><div class="two"><div class="card"><div class="sub">'+t('outst')+'</div><div class="big">'+money(T.due)+'</div></div><div class="card"><div class="sub">'+t('joinedC')+'</div><div class="big">'+S.d.apts.filter(function(a){return a.resident_id}).length+' / '+S.d.apts.length+'</div></div></div>';
    var cm=S.d.cash.filter(function(c){return c.period==nowP()})[0];
    h+='<div class="two"><div class="card"><div class="sub">'+t('lateC')+'</div><div class="big">'+lateList().length+' / '+S.d.apts.length+'</div></div><div class="card"><div class="sub">'+t('cashThisM')+'</div><div class="big">'+money(cm?cm.total:0)+'</div></div></div>'+lateCard()+reportCard();
  }
  if(tb=='fees')h+=payTab(b);
  if(tb=='inc')h+=incTab(b);
  if(tb=='exp'){
    var ms=months(),sm=S.selM||ms[0],list=S.d.exps.filter(function(e){return e.period==sm}).reverse();
    h+='<div class="card"><h3>'+t('addExp')+'</h3><label for="ec">'+t('cat')+'</label><select id="ec" onchange="$(\'enl\').textContent=t(this.value==\'oth\'?\'noteReq\':\'note\')">'+['elec','water','lift','clean','sec','rep','oth'].map(function(k){return '<option value="'+k+'">'+catName(k)+'</option>'}).join('')+'</select><label for="ea">'+t('amt').replace(/.*/,t('payAmt'))+'</label><input id="ea" type="number" dir="ltr" inputmode="decimal" placeholder="0"><label for="em2">'+t('month')+'</label><select id="em2">'+expMonths().map(function(p){return '<option value="'+p+'"'+(p==sm?' selected':'')+'>'+ml(p)+'</option>'}).join('')+'</select><label for="en" id="enl">'+t('note')+'</label><input id="en"><label for="ef">'+t('photo')+'</label><input id="ef" type="file" accept="image/*"><div class="err" id="err"></div><button class="btn go full" style="margin-top:6px" onclick="addExp()">'+t('saveExp')+'</button></div>';
    h+=monthPick(ms,sm)+expList(list,true,sm);
    h+='<button class="btn ghost full" onclick="shareStmt(\''+sm+'\')">'+t('shareM')+'</button>';
  }
  if(tb=='res'){
    h+='<div class="card"><div class="sub">'+t('bCode')+'</div><div class="code" dir="ltr" style="text-align:start">'+esc(b.code)+'</div></div><div class="note">'+t('legend')+'</div>'+noteForm(b);
    var fl=-1;S.d.apts.forEach(function(a){if(a.floor!=fl){if(fl>=0)h+='</div></div>';fl=a.floor;h+='<div class="card"><b>'+flLbl(fl)+'</b><div class="chips">'}
      var st=a.resident_id?'joined':a.invited?'invited':'none';h+='<button class="chip '+st+(a.id==S.asel?' sel':'')+'" onclick="S.asel=\''+a.id+'\';render()">'+a.code+'</button>'});
    if(fl>=0)h+='</div></div>';
    if(S.asel){var sa=S.d.apts.filter(function(a){return a.id==S.asel})[0];if(sa)h+='<div class="card"><b>'+t('apt')+' '+sa.code+'</b><div class="sub">'+(sa.resident_id?esc(personOf(sa))+' · '+t('joined'):t(sa.invited?'invited':'notInv'))+'</div>'+(sa.resident_id?'<div class="note">'+t('rmResP')+'</div><button class="btn ghost full" onclick="unlinkRes(\''+sa.id+'\')">'+(S.delk=='u'+sa.id?t('delConf'):t('rmRes'))+'</button>':'<button class="btn go full" onclick="invite(\''+sa.id+'\')">'+t('invite')+'</button>')+'</div>'}
  }
  if(tb=='hist'){h+='<div class="note" style="margin-top:0">'+t('histNote')+'</div><div class="card">'+(S.d.log.length?S.d.log.map(function(e){return '<div class="item"><div>'+esc(logText(e))+'</div><div class="sub">'+new Date(e.created_at).toLocaleDateString('en-GB')+'</div></div>'}).join(''):'<div class="sub">'+t('noH')+'</div>')+'</div>'}
  return h;

/* ---------- late apartments, reports, Excel backup (manager) ---------- */
function lateList(){return S.d.apts.map(function(a){var d=dueOf(a.id);if(d<=0)return null;var ps=openPeriods(a.id).filter(function(p){return leftIn(a.id,p)>0}).sort();return {a:a,d:d,from:ps[0]||''}}).filter(Boolean).sort(function(x,y){return y.d-x.d})}
function lateCard(){
  var L=lateList();
  var h='<div class="row" style="margin-top:18px"><h2 style="margin:0">'+t('lateT')+'</h2>'+(L.length?'<button class="btn small ghost" onclick="shareLate()">'+t('lateShare')+'</button>':'')+'</div><div class="card" style="margin-top:8px">';
  if(!L.length)return h+'<div class="sub">'+t('lateNone')+'</div></div>';
  return h+L.map(function(x){return '<div class="item wrap"><div style="flex:1"><b>'+esc(x.a.code)+'</b> <span class="sub">'+esc(personOf(x.a))+'</span>'+(x.from?'<div class="sub">'+t('lateSince',{p:ml(x.from)})+'</div>':'')+'</div><span class="tag due">'+money(x.d)+'</span><div class="acts" style="width:auto"><button class="btn small ghost" onclick="remind(\''+x.a.id+'\')">'+t('lateRemind')+'</button></div></div>'}).join('')+'</div>';
}
function shareLate(){var L=lateList();send(t('lateHead',{b:bcur().name})+'\n'+L.map(function(x){return '- '+x.a.code+(personOf(x.a)?' ('+personOf(x.a)+')':'')+': '+money(x.d)}).join('\n')+'\n— it7ad molak | إتحاد ملاك')}
function payMonth(p){var d=new Date(p.created_at);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)}
function inP(s,P){s=String(s||'');return !!s&&(s==P||(P.length==4&&s.slice(0,4)==P))}
function repPeriods(){
  var set={};set[nowP()]=1;
  S.d.charges.forEach(function(c){set[c.period]=1});S.d.exps.forEach(function(e){set[e.period]=1});S.d.pays.forEach(function(p){set[payMonth(p)]=1});
  var ys={};Object.keys(set).forEach(function(p){ys[String(p).slice(0,4)]=1});
  var out=[];Object.keys(ys).sort().reverse().forEach(function(y){out.push(y);Object.keys(set).filter(function(p){return p.length==7&&p.slice(0,4)==y}).sort().reverse().forEach(function(p){out.push(p)})});
  return out;
}
function repLabel(p){return p.length==4?t('repYear',{y:p}):ml(p)}
function reportCard(){
  var ps=repPeriods(),sel=S.rper&&ps.indexOf(S.rper)>=0?S.rper:nowP();

  if(what=='activate'){st='active';var base=b.license_ends&&new Date(b.license_ends).getTime()>now?new Date(b.license_ends).getTime():now;ends=new Date(base+365*D).toISOString()}
  else if(what=='trial'){st='trial';var tb=new Date(b.trial_ends).getTime();ends=new Date(Math.max(tb,now)+14*D).toISOString()}
  else if(what=='pause')st='paused';else if(what=='lock')st='locked';
  else if(what=='resume')st=b.license_ends&&new Date(b.license_ends).getTime()>now?'active':'trial';
  if(what=='resume'&&st=='active')ends=b.license_ends;
  return ownAct(function(){return sb.rpc('admin_set_building',{p_building:id,p_status:st,p_ends:ends,p_note:note==null?b.admin_note:note})},what=='note'?'ownSaved':'ownDone2');
}
function restoreB(id){return ownAct(function(){return sb.rpc('admin_restore_building',{p_building:id})},'ownRestored')}
function purgeB(id){if(S.delk!='x'+id){S.delk='x'+id;render();return}S.delk='';return ownAct(function(){return sb.rpc('admin_purge_building',{p_building:id})},'ownPurged')}
function resetMgr(id){
  if(S.delk!='r'+id){S.delk='r'+id;render();return}S.delk='';
  var b=S.adm.filter(function(x){return x.id==id})[0];
  return ownAct(function(){return sb.rpc('admin_reset_manager',{p_email:b.manager_email})},'ownResetOk');
}
async function ownAct(fn,msg){
  if(S.busy)return;S.busy=true;
  try{var r=await fn();if(r&&r.error)throw r.error;S.busy=false;await loadOwner();render();toast(t(msg))}catch(x){fail(x)}
}


/* ---------- notifications ---------- */
function unreadN(){return (S.notifs||[]).filter(function(n){return !n.read}).length}
function bellBadge(){var b=$('bb');if(!b)return;var n=unreadN();b.textContent=n>9?'9+':String(n);b.style.display=n?'inline-block':'none'}
async function loadNotifs(){
  var q=await sb.from('notifications').select('id,kind,message,data,read,created_at').order('created_at',{ascending:false}).limit(50);
  if(q.error)throw q.error;var old=unreadN();S.notifs=q.data||[];bellBadge();
  if(unreadN()>old&&S.scr!='notif')toast(t('nT')+': '+unreadN())
}
function notifText(n){
  var d=n.data||{},k=n.kind;
  if(k=='announce')return esc(n.message);
  if(k=='payment')return esc(t('nPay',{a:money(d.amount),r:d.receipt}));
  if(k=='paycancel')return esc(t('nPayC',{a:money(d.amount),r:d.receipt}));
  if(k=='fee')return esc(t('nFee',{p:ml(d.period),a:money(d.amount)}));
  if(k=='reply')return esc(t('nReply'));
  if(k=='settled')return esc(t('nSettled',{p:ml(d.period)}));
  if(k=='exempt')return esc(t('nExempt'));
  if(k=='unlinked')return esc(t('nUnlinked',{c:d.apt||'',b:d.building||''}));
  if(k=='transfer')return esc(t(d.apt?'nXfer2':'nXfer',{f:d.from||'',b:d.building||'',c:d.apt||''}));
  if(k=='xferdone')return esc(t(d.apt?'nXferDone2':'nXferDone',{n:d.name||'',b:d.building||'',c:d.apt||''}));
  if(k=='xferno')return esc(t('nXferNo',{b:d.building||''}));
  if(k=='xferyou')return esc(t('nXferYou',{b:d.building||''}));
  if(k=='xferout')return esc(t('nXferOut',{b:d.building||''}));
  if(k=='restored')return esc(t('nRestored',{b:d.building||''}));
  if(k=='license')return esc(t('nLic',{b:d.building||'',s:t('b_'+d.status)}));
  return esc(n.message||'')
}
function notifHead(n){var d=n.data||{};if(n.kind!='announce')return '';return '<div class="sub"><b>'+(d.from=='owner'?t('nOwner'):t('nFromB',{b:esc(d.building||'')}))+'</b>'+(d.apt?' · '+t('nToApt',{a:esc(d.apt)}):'')+'</div>'}
async function openNotifs(){
  try{await loadNotifs();S.nview=(S.notifs||[]).map(function(n){return {n:n,isNew:!n.read}});go('notif');
    if(unreadN()){var m=await sb.rpc('mark_notifs_read');if(!m.error){S.notifs.forEach(function(n){n.read=true});bellBadge()}}}catch(x){fail(x)}
}
function vNotif(){
  var h=back('home')+'<h1 style="margin-top:10px">'+t('nT')+'</h1>';
  if(!S.nview||!S.nview.length)return h+'<div class="note">'+t('nNone')+'</div>';
  return h+'<div class="card" style="margin-top:0">'+S.nview.map(function(x){var n=x.n;return '<div class="item wrap"><div style="flex:1">'+notifHead(n)+'<div>'+notifText(n)+'</div><div class="sub">'+new Date(n.created_at).toLocaleDateString('en-GB')+'</div></div>'+(x.isNew?'<span class="tag due">'+t('nNewTag')+'</span>':'')+'</div>'}).join('')+'</div>';
}
function noteForm(b){
  var opts='<option value="">'+t('nAll')+'</option>'+S.d.apts.filter(function(a){return a.resident_id}).map(function(a){return '<option value="'+a.id+'">'+t('apt')+' '+a.code+' · '+esc(personOf(a))+'</option>'}).join('');
  return '<div class="card"><b>'+t('nSendT')+'</b><label for="nt">'+t('nTo')+'</label><select id="nt">'+opts+'</select><label for="nm">'+t('nMsg')+'</label><textarea id="nm" rows="3" maxlength="500"></textarea><div class="err" id="err"></div><button class="btn go full" onclick="sendNote()">'+t('nSend')+'</button></div>'
}
function sendNote(){
  var m=$('nm').value.trim(),a=$('nt').value;if(m.length<5){setErr('eMsg');return}
  return act(function(){return sb.rpc('notify_building',{p_building:S.cur,p_apartment:a||null,p_message:m})},function(n){return t('nSent',{n:n})});
}
async function sendOwnerNote(){
  var m=$('am').value.trim(),tg=$('at').value;if(m.length<5){setErr('eMsg');return}if(S.busy)return;S.busy=true;
  try{var r=await sb.rpc('owner_notify',{p_target:tg,p_message:m});if(r.error)throw r.error;S.busy=false;toast(t('nSent',{n:r.data}));$('am').value=''}catch(x){fail(x)}
}


/* ---------- hand a building to another manager ---------- */
async function openXfer(id){S.xb=id;S.xapts=[];try{var q=await sb.from('apartments').select('code,resident_id').eq('building_id',id).order('floor').order('code');S.xapts=(q.data||[]).filter(function(a){return !a.resident_id})}catch(e){}go('xfer')}
function vXfer(){
  var b=S.blds.filter(function(x){return x.id==S.xb})[0]||{name:''},out=(S.xfers||[]).filter(function(x){return x.building_id==S.xb&&x.from_user==S.user.id})[0];
  var h=back('settings')+'<h1 style="margin-top:10px">'+t('xfT')+'</h1><div class="sub"><b>'+esc(b.name)+'</b></div><div class="note">'+t('xfP')+'</div>';
  if(out)return h+'<div class="card"><b>'+t('xfWait',{e:'<span dir="ltr">'+esc(out.to_email)+'</span>'})+'</b>'+(out.from_apt?'<div class="sub">'+t('xfWaitApt',{c:'<span dir="ltr">'+esc(out.from_apt)+'</span>'})+'</div>':'')+'<button class="btn ghost full" onclick="cancelX(\''+out.id+'\')">'+t('xfCancel')+'</button></div>';
  return h+'<div class="card"><label for="xe">'+t('xfEmail')+'</label><input id="xe" type="email" dir="ltr" inputmode="email" placeholder="name@example.com"></div><div class="card"><label for="xa">'+t('xfApt')+'</label><div class="note">'+t('xfAptP')+'</div>'+((S.xapts||[]).length?'<select id="xa"><option value="">'+t('xfChApt')+'</option>'+S.xapts.map(function(a){return '<option value="'+esc(a.code)+'">'+esc(a.code)+'</option>'}).join('')+'</select>':'<div class="warn">'+t('xfNoApt')+'</div>')+'</div><div class="err" id="err"></div><button class="btn go full" style="margin-top:0" onclick="sendX()">'+t('xfSend')+'</button>';
}
async function sendX(){
  var e=cleanEmail($('xe').value);if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){setErr('eEml');return}var ap=$('xa')?$('xa').value:'';if(!ap){setErr('eXApt');return}if(S.busy)return;S.busy=true;
  try{var r=await sb.rpc('request_transfer',{p_building:S.xb,p_email:e,p_apt:ap});if(r.error)throw r.error;S.busy=false;await loadHome();toast(t('xfSent'));render()}catch(x){fail(x)}
}
async function cancelX(id){if(S.busy)return;S.busy=true;try{var r=await sb.rpc('cancel_transfer',{p_id:id});if(r.error)throw r.error;S.busy=false;await loadHome();toast(t('xfCancelled'));render()}catch(x){fail(x)}}
async function answerX(id,ok){
  if(S.busy)return;S.busy=true;
  try{var r=await sb.rpc('answer_transfer',{p_id:id,p_accept:ok});if(r.error)throw r.error;S.busy=false;await loadHome();toast(t(ok?'xDone':'xNo'));render()}catch(x){fail(x)}
}
function setXfer(id){
  var el=$('xt_'+id),v=el?el.value.trim().toLowerCase():'';S.xemail=S.xemail||{};
  if(S.delk!='t'+id){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast(t('eEml'));return}S.xemail[id]=v;S.delk='t'+id;render();return}
  S.delk='';return ownAct(function(){return sb.rpc('admin_transfer_building',{p_building:id,p_email:S.xemail[id]})},'ownDone2');
}

/* ---------- render ---------- */
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
  $('lg').textContent=t('langBtn');$('lg').onclick=function(){setLang(lang=='ar'?'en':'ar')};
  var f={login:vLogin,code:vCode,profile:vProfile,mfa:vMfa,mfaSetup:vMfaSetup,home:vHome,join:vJoin,create:vCreate,dash:vDash,settings:vSettings,xfer:vXfer,notif:vNotif,support:vSupport,owner:vOwner,editB:vEditB,delB:vDelB};
  var stb=$('st');if(stb){stb.style.display=(S.user&&S.profile&&['home','dash','join','create','settings','support','owner'].indexOf(S.scr)>=0)?'inline-block':'none';stb.setAttribute('aria-label',t('settingsBtn'));stb.onclick=function(){snap();go('settings')}}
  var bl=$('bl');if(bl){bl.style.display=(S.user&&S.profile&&['home','dash','join','create','settings','support','owner','notif','xfer'].indexOf(S.scr)>=0)?'inline-block':'none';bl.setAttribute('aria-label',t('nBell'));bl.onclick=function(){snap();openNotifs()};bellBadge()}
  $('main').innerHTML=f[S.scr]();
  if(S.scr=='code')startCd();
  var nav=$('nav'),tr=$('tour'),b=S.scr=='dash'?bcur():null;
  if(b){var lk=S.role=='manager'&&bstate(b)!='trial'&&bstate(b)!='active';nav.style.display='flex';$('tabs').innerHTML=TABS[S.role].map(function(x,i){return '<button class="'+(x[0]==S.tab?'on ':'')+(S.tour&&S.tour.i==i?'hl':'')+'" onclick="'+(S.tour?'':'S.tab=\''+x[0]+'\';S.delk=\'\';render()')+'">'+t(x[1])+(lk?'<br><small style="color:var(--bad)">'+t('locked')+'</small>':'')+'</button>'}).join('')}else nav.style.display='none';
  if(S.tour&&b){var s=TS[S.tour.r],n=s.length,x=s[S.tour.i],pos=((S.tour.i+.5)/n*100),ar=lang=='ar';
    tr.innerHTML='<div class="tcard"><div class="sub">'+t('tStep',{i:S.tour.i+1,n:n})+'</div><h3>'+t(x[1])+'</h3><p>'+t(x[2])+'</p><div class="row"><button class="btn small ghost" onclick="endTour()">'+t('skipT')+'</button><div><button class="btn small ghost" '+(S.tour.i?'':'disabled')+' onclick="tourGo(-1)">'+t('backT')+'</button> <button class="btn small go" onclick="tourGo(1)">'+(S.tour.i==n-1?t('done'):t('next'))+'</button></div></div><i class="arrow" style="'+(ar?'right:'+pos+'%;transform:translateX(50%) rotate(45deg)':'left:'+pos+'%')+'"></i></div>';tr.className='tour show'}else tr.className='tour';
}
async function init(){
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js')}catch(e){}
  var m=location.search.match(/[?&]join=([A-Za-z0-9-]+)/);if(m){S.pre=m[1].toUpperCase();try{localStorage.setItem('pre',S.pre)}catch(e){}}else{try{S.pre=localStorage.getItem('pre')||''}catch(e){}}try{var th=localStorage.getItem('theme');if(th)applyTheme(th)}catch(e){}
  render();
  try{var s=await sb.auth.getSession();if(s.data.session){var ea=parseInt(lsGet('emailAt')||'0',10);if(!ea){lsSet('emailAt',String(Date.now()))}else if(Date.now()-ea>CFG.emailDays*864e5){await sb.auth.signOut();ssSet('unlocked',null);lsSet('emailAt',null);S.weekly=true;go('login');return}S.user=s.data.session.user;await mfaState();await afterAuth();await mfaState().then(function(){if(S.scr=='home')render()})}}catch(x){console.error(x)}
}
var pollT=null;
function startPoll(){clearInterval(pollT);pollT=setInterval(pollNow,20000)}
async function pollNow(){
  if(!S.user||!S.profile||document.hidden||S.busy)return;
  try{var old=unreadN();await loadNotifs();
    if(unreadN()>old&&S.role=='resident'&&S.scr=='dash'&&!S.tour){await loadBuilding();render()}
    else if(unreadN()>old&&S.scr=='home'){await loadHome();render()}}catch(e){}
}
try{document.addEventListener('visibilitychange',function(){if(!document.hidden)pollNow()})}catch(e){}
startPoll();
window.__ready=init();

</script>
</body>
